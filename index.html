<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiestas de Calanda 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
<style>
  :root{
    --fondo:#000000;
    --superficie:#1c1c1e;
    --superficie-alta:#242426;
    --borde:rgba(255,255,255,.09);
    --borde-fuerte:rgba(255,255,255,.18);
    --texto:#f5f5f7;
    --texto-tenue:#98989d;
    --texto-tenue2:#6e6e73;
    --acento:#f2b544;
    --acento-texto:#1a1400;
    --exito:#32d74b;
    --error:#ff453a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    color:var(--texto);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(242,181,68,.10), transparent),
      var(--fondo);
    display:flex;
    justify-content:center;
    padding:64px 20px 48px;
  }

  .contenedor{
    width:100%;
    max-width:440px;
    animation:aparecer .5s ease both;
  }
  @keyframes aparecer{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .cabecera{
    text-align:center;
    margin-bottom:36px;
    padding:0 8px;
  }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.09em;
    font-size:.72rem;
    font-weight:600;
    color:var(--acento);
    margin:0 0 10px;
  }
  h1{
    margin:0 0 10px;
    font-size:2rem;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.15;
  }
  .subtitulo{
    margin:0;
    color:var(--texto-tenue);
    font-size:1rem;
    line-height:1.5;
  }

  .tarjeta{
    background:var(--superficie);
    border:1px solid var(--borde);
    border-radius:20px;
    padding:28px 24px 24px;
  }

  .campo{ margin-bottom:28px; }
  .campo:last-of-type{ margin-bottom:0; }

  .etiqueta{
    display:block;
    font-size:.95rem;
    font-weight:600;
    margin-bottom:12px;
    letter-spacing:-.01em;
  }
  .etiqueta .opcional{
    font-weight:400;
    color:var(--texto-tenue2);
  }

  input[type="text"]{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--borde);
    border-radius:12px;
    background:var(--superficie-alta);
    color:var(--texto);
    font-size:1rem;
    font-family:inherit;
    outline:none;
    transition:border-color .18s ease, background .18s ease;
  }
  input[type="text"]::placeholder{ color:var(--texto-tenue2); }
  input[type="text"]:focus{
    border-color:var(--borde-fuerte);
    background:#2c2c2e;
  }

  .opciones{
    display:flex;
    gap:8px;
  }
  .opcion{
    flex:1;
    position:relative;
  }
  .opcion input{
    position:absolute;
    opacity:0;
    inset:0;
    width:100%;
    height:100%;
    cursor:pointer;
    margin:0;
  }
  .opcion span{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:12px 6px;
    border-radius:11px;
    border:1px solid var(--borde);
    background:var(--superficie-alta);
    font-size:.9rem;
    font-weight:500;
    color:var(--texto-tenue);
    transition:.16s ease;
    min-height:44px;
    line-height:1.25;
  }
  .opcion input:checked + span{
    background:var(--acento);
    border-color:var(--acento);
    color:var(--acento-texto);
    font-weight:600;
  }
  .opcion input:focus-visible + span{
    outline:2px solid var(--acento);
    outline-offset:2px;
  }
  .opcion span:active{ transform:scale(.97); }

  .campo-error{
    font-size:.8rem;
    color:var(--error);
    margin-top:8px;
    display:none;
  }

  button[type="submit"]{
    width:100%;
    margin-top:8px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--acento);
    color:var(--acento-texto);
    font-size:1rem;
    font-family:inherit;
    font-weight:600;
    letter-spacing:-.01em;
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  button[type="submit"]:hover{ opacity:.92; }
  button[type="submit"]:active{ transform:scale(.985); }
  button[type="submit"]:disabled{ opacity:.5; cursor:default; }

  .mensaje{
    margin-top:16px;
    padding:13px 14px;
    border-radius:12px;
    text-align:center;
    font-size:.9rem;
    font-weight:500;
    border:1px solid transparent;
    display:none;
  }
  .mensaje.ok{
    display:block;
    background:rgba(50,215,75,.1);
    border-color:rgba(50,215,75,.25);
    color:var(--exito);
  }
  .mensaje.error{
    display:block;
    background:rgba(255,69,58,.1);
    border-color:rgba(255,69,58,.25);
    color:var(--error);
  }

  .pie{
    text-align:center;
    font-size:.78rem;
    color:var(--texto-tenue2);
    margin:24px 10px 0;
    line-height:1.5;
  }

  @media (max-width:380px){
    h1{ font-size:1.7rem; }
    .tarjeta{ padding:22px 18px 20px; }
  }
</style>
</head>
<body>

<div class="contenedor">
  <div class="cabecera">
    <p class="eyebrow">Fiestas de Calanda</p>
    <h1>Confirma tu asistencia</h1>
    <p class="subtitulo">Ayúdanos a organizar la fiesta de este año.</p>
  </div>

  <div class="tarjeta">
    <form id="form-fiesta" novalidate>

      <div class="campo">
        <label class="etiqueta" for="nombre">Nombre <span class="opcional">(opcional)</span></label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" maxlength="80" autocomplete="name">
      </div>

      <div class="campo">
        <label class="etiqueta">¿Asistes a la fiesta?</label>
        <div class="opciones" role="radiogroup" aria-label="¿Asistes a la fiesta?">
          <label class="opcion">
            <input type="radio" name="asiste" value="Sí" required>
            <span>Sí</span>
          </label>
          <label class="opcion">
            <input type="radio" name="asiste" value="No" required>
            <span>No</span>
          </label>
        </div>
        <div class="campo-error" id="error-asiste">Elige una opción.</div>
      </div>

      <div class="campo">
        <label class="etiqueta">¿Te quedas a cenar?</label>
        <div class="opciones" role="radiogroup" aria-label="¿Te quedas a cenar?">
          <label class="opcion">
            <input type="radio" name="cena" value="Sí" required>
            <span>Sí</span>
          </label>
          <label class="opcion">
            <input type="radio" name="cena" value="No" required>
            <span>No</span>
          </label>
          <label class="opcion">
            <input type="radio" name="cena" value="Aún no lo sé" required>
            <span>Aún no lo sé</span>
          </label>
        </div>
        <div class="campo-error" id="error-cena">Elige una opción.</div>
      </div>

      <button type="submit" id="btn-enviar">Enviar respuesta</button>

      <div class="mensaje" id="mensaje"></div>
    </form>
  </div>

  <p class="pie">Tus respuestas se guardan directamente en la hoja de cálculo de la organización.</p>
</div>

<script>
  // EDITA AQUÍ: pega la URL de tu Google Apps Script (termina en /exec).
  // Instrucciones para obtenerla: README.md
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0aVuWbeX2yDEinbCwkYfUCIquFZAo6QKLvQhd5nlrytnkSqLjd-Gqo3xO4nJRmt4_/exec';

  const form = document.getElementById('form-fiesta');
  const btn = document.getElementById('btn-enviar');
  const mensaje = document.getElementById('mensaje');
  const errorAsiste = document.getElementById('error-asiste');
  const errorCena = document.getElementById('error-cena');

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = 'mensaje ' + tipo;
  }

  form.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    mensaje.className = 'mensaje';
    errorAsiste.style.display = 'none';
    errorCena.style.display = 'none';

    const datos = new FormData(form);
    const asiste = datos.get('asiste');
    const cena = datos.get('cena');

    let valido = true;
    if (!asiste) { errorAsiste.style.display = 'block'; valido = false; }
    if (!cena) { errorCena.style.display = 'block'; valido = false; }
    if (!valido) return;

    if (SCRIPT_URL.includes('PEGA_AQUI_TU_ID_DE_DESPLIEGUE')) {
      mostrarMensaje('Falta configurar la URL de Google Apps Script (ver README.md).', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
      // mode:'no-cors' porque el Web App de Apps Script no puede leerse
      // desde otro origen; el envío llega igualmente y se guarda en la hoja.
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: datos });
      form.reset();
      mostrarMensaje('Gracias, tu respuesta se ha guardado.', 'ok');
    } catch (e) {
      mostrarMensaje('No se pudo enviar. Comprueba tu conexión e inténtalo de nuevo.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar respuesta';
    }
  });
</script>

</body>
</html>
